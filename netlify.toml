[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  # These are plain settings, not secrets; their values (model name, "mock", URLs, numbers) legitimately appear in code and docs.
  # Real secrets (API keys, webhook secret, Turso token) are still scanned.
  SECRETS_SCAN_OMIT_KEYS = "GEMMA_MODEL,DEVDRAFT_MODE,DEVDRAFT_BASE_URL,DEVDRAFT_CHECKOUT_BASE,DEVDRAFT_FALLBACK_LINK_TYPE,PUBLIC_BASE_URL,ZMW_PER_USD,DEMO_MAX_USD,ALLOW_SIMULATE"
